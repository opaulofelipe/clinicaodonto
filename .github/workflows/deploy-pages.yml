name: Deploy built Vite site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: clinicaodonto-final-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for branch Pages deployment
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Waiting for the automatic branch Pages workflow for commit $COMMIT_SHA..."
          for attempt in $(seq 1 72); do
            response=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/actions/runs?head_sha=$COMMIT_SHA&per_page=30")

            status=$(echo "$response" | jq -r '[.workflow_runs[] | select(.name == "pages build and deployment")][0].status // empty')
            conclusion=$(echo "$response" | jq -r '[.workflow_runs[] | select(.name == "pages build and deployment")][0].conclusion // empty')

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "Automatic branch Pages deployment completed. Continuing with the Vite build."
                exit 0
              fi

              echo "Automatic branch Pages deployment finished with conclusion: $conclusion"
              exit 1
            fi

            echo "Attempt $attempt/72: automatic Pages deployment status = ${status:-not-started}"
            sleep 5
          done

          echo "Timed out waiting for the automatic branch Pages deployment."
          exit 1

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy built site
        id: deployment
        uses: actions/deploy-pages@v4
